
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - BioTransit</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>BioTransit</h1>
        <p>Digitalizacion del recaudo en el transporte publico</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="index.html#proyecto">Proyecto</a>
        <a href="index.html#funcionamiento">Funcionamiento</a>
        <a href="index.html#seguridad">Seguridad</a>
        <a href="index.html#beneficios">Beneficios</a>
        <a href="registro.html">Registro</a>
    </nav>

    <section class="formulario-registro">
        <h2>Formulario de registro</h2>

        <p>
            Completa los siguientes campos para mostrar tu interes
            en el proyecto BioTransit.
        </p>

        <form>
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="correo">Correo electronico:</label>
            <input type="email" id="correo" name="correo" required>

            <label for="tipo">Tipo de usuario:</label>
            <select id="tipo" name="tipo" required>
                <option value="">Selecciona una opcion</option>
                <option value="estudiante">Estudiante</option>
                <option value="discapacidad">Persona con discapacidad</option>
                <option value="otro">Otro</option>
            </select>

            <button type="submit">Enviar registro</button>
        </form>

        <a href="index.html" class="volver">Volver al inicio</a>
    </section>

</body>
</html>
